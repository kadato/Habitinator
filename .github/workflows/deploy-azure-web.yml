name: Deploy Web app to Azure

on:
  workflow_dispatch:

concurrency:
  group: deploy-azure-web-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NO_LOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
  JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
  DEMO_USER_EMAIL: ${{ vars.DEMO_USER_EMAIL }}
  DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Validate Azure OIDC variables
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        env:
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "${TENANT_ID}" || { echo "::error::Set repository variable AZURE_TENANT_ID when AZURE_CLIENT_ID (OIDC) is set."; exit 1; }
          test -n "${SUBSCRIPTION_ID}" || { echo "::error::Set repository variable AZURE_SUBSCRIPTION_ID when AZURE_CLIENT_ID (OIDC) is set."; exit 1; }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
          dotnet-quality: 'preview'

      - name: Setup Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure azd to use Azure CLI auth
        run: azd config set auth.useAzCliAuth "true"

      - name: Resolve Azure subscription for azd
        shell: bash
        env:
          SUB_FROM_VAR: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -n "${SUB_FROM_VAR}" ]; then
            echo "Using AZURE_SUBSCRIPTION_ID from repository variable."
            echo "AZURE_SUBSCRIPTION_ID=${SUB_FROM_VAR}" >> "$GITHUB_ENV"
            az account set --subscription "${SUB_FROM_VAR}"
          else
            AZ_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
            test -n "${AZ_SUBSCRIPTION_ID}"
            echo "AZURE_SUBSCRIPTION_ID=${AZ_SUBSCRIPTION_ID}" >> "$GITHUB_ENV"
          fi

      - name: Ensure azd environment exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AZURE_ENV_NAME}"
          test -n "${AZURE_LOCATION}"
          test -n "${AZURE_SUBSCRIPTION_ID}"
          if [ ! -d ".azure/${AZURE_ENV_NAME}" ]; then
            echo "Creating azd environment '${AZURE_ENV_NAME}' (no local .azure/ on CI)."
            azd env new "${AZURE_ENV_NAME}" -l "${AZURE_LOCATION}" --subscription "${AZURE_SUBSCRIPTION_ID}" --no-prompt
          else
            echo "Using existing azd environment '.azure/${AZURE_ENV_NAME}'."
          fi

      - name: Pin azd resource group
        if: ${{ vars.AZURE_RESOURCE_GROUP != '' }}
        run: |
          azd env set AZURE_RESOURCE_GROUP "${AZURE_RESOURCE_GROUP}"
          echo "Pinned AZURE_RESOURCE_GROUP=${AZURE_RESOURCE_GROUP}"

      - name: Validate required variables and secrets
        shell: bash
        run: |
          test -n "${AZURE_SUBSCRIPTION_ID}"
          test -n "${AZURE_ENV_NAME}"
          test -n "${AZURE_LOCATION}"
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ]; then
            echo "::warning title=AZURE_RESOURCE_GROUP::Repository variable AZURE_RESOURCE_GROUP is unset; azd may infer rg-\${AZURE_ENV_NAME}. Set it for deterministic deploys."
          else
            echo "Using AZURE_RESOURCE_GROUP=${AZURE_RESOURCE_GROUP}"
          fi
          test -n "${POSTGRES_CONNECTION_STRING}"
          test -n "${JWT_SIGNING_KEY}"
          test -n "${DEMO_USER_PASSWORD}"
          if [ -z "${DEMO_USER_EMAIL}" ]; then
            echo "DEMO_USER_EMAIL is not set; defaulting to guest@habitinator.local"
            echo "DEMO_USER_EMAIL=guest@habitinator.local" >> "$GITHUB_ENV"
          fi

      - name: Provision + deploy with azd
        run: azd up --no-prompt

      - name: Capture deployment outputs
        shell: bash
        run: |
          WEB_URL="$(azd env get-value AZURE_WEBAPP_URL)"
          if [ -n "$WEB_URL" ]; then
            echo "Deployed web URL: $WEB_URL"
          fi
