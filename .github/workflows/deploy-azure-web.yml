name: Deploy Web app to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NO_LOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
  JWT_ISSUER: ${{ vars.JWT_ISSUER }}
  JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
  DEMO_USER_EMAIL: ${{ vars.DEMO_USER_EMAIL }}
  DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          dotnet-quality: 'preview'

      - name: Setup Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure azd to use Azure CLI auth
        run: azd config set auth.useAzCliAuth "true"

      - name: Resolve Azure subscription for azd
        shell: bash
        run: |
          AZ_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          test -n "${AZ_SUBSCRIPTION_ID}"
          echo "AZURE_SUBSCRIPTION_ID=${AZ_SUBSCRIPTION_ID}" >> "$GITHUB_ENV"

      - name: Validate required variables and secrets
        shell: bash
        run: |
          test -n "${AZURE_SUBSCRIPTION_ID}"
          test -n "${AZURE_ENV_NAME}"
          test -n "${AZURE_LOCATION}"
          test -n "${POSTGRES_CONNECTION_STRING}"
          test -n "${JWT_ISSUER}"
          test -n "${JWT_SIGNING_KEY}"
          test -n "${DEMO_USER_PASSWORD}"
          if [ -z "${DEMO_USER_EMAIL}" ]; then
            echo "DEMO_USER_EMAIL is not set; defaulting to guest@habitinator.local"
            echo "DEMO_USER_EMAIL=guest@habitinator.local" >> "$GITHUB_ENV"
          fi

      - name: Provision + deploy with azd
        run: azd up --no-prompt

      - name: Capture deployment outputs
        shell: bash
        run: |
          WEB_URL="$(azd env get-value AZURE_WEBAPP_URL)"
          if [ -n "$WEB_URL" ]; then
            echo "Deployed web URL: $WEB_URL"
          fi
