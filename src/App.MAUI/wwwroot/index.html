<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Habitinator</title>
    <base href="/"/>
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css"/>
    <link rel="stylesheet" href="_content/App.Shared.RCL/css/typography.css"/>
    <link rel="stylesheet" href="_content/App.Shared.RCL/css/app.css"/>
    <link rel="stylesheet" href="app.css"/>
    <link rel="stylesheet" href="_content/App.Shared.RCL/css/auth-pages.css"/>
    <link rel="stylesheet" href="App.MAUI.styles.css"/>
    <link rel="icon" href="data:,">
</head>

<body>

<div class="status-bar-safe-area"></div>

<div id="app">
    <output class="maui-splash" aria-label="Loading application">
        <div class="maui-splash__inner">
            <div class="maui-splash__logo" aria-hidden="true">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="48" height="48" rx="14" fill="url(#maui-splash-grad)"/>
                    <path d="M15 26h3v7h-3zM21 20h3v13h-3zM27 23h3v10h-3zM33 17h3v16h-3z" fill="#fff" opacity="0.95"/>
                    <defs>
                        <linearGradient id="maui-splash-grad" x1="0" y1="0" x2="48" y2="48">
                            <stop offset="0%" stop-color="#3b82f6"/>
                            <stop offset="100%" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <p class="maui-splash__title">Habitinator</p>
            <div class="maui-splash__loader" aria-hidden="true">
                <div class="maui-splash__loader-bar"></div>
            </div>
            <p class="maui-splash__hint">Loading&hellip;</p>
        </div>
    </output>
</div>

<div id="blazor-error-ui" data-nosnippet>
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">🗙</span>
</div>

<script>globalThis.habitinatorIsMaui = true;</script>
<script src="_content/App.Shared.RCL/js/scriptLoader.js"></script>
<script src="_content/MudBlazor/MudBlazor.min.js"></script>
<script src="_content/App.Shared.RCL/js/sortable.min.js"
        data-habitinator-src="_content/App.Shared.RCL/js/sortable.min.js"
        data-habitinator-loaded="1"></script>
<script src="_content/App.Shared.RCL/js/boardSortable.js"
        data-habitinator-src="_content/App.Shared.RCL/js/boardSortable.js"
        data-habitinator-loaded="1"></script>
<script src="_content/App.Shared.RCL/js/focusTimerAlert.js"></script>
<script src="_content/App.Shared.RCL/js/userTimezone.js"></script>
<script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
