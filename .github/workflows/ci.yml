name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habitinator_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d habitinator_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NO_LOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TestResultsDir: ${{ github.workspace }}/TestResults
      APPWEB_INTEGRATIONTESTS_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=habitinator_integration;Username=postgres;Password=postgres;Pooling=false;Timeout=15;Command Timeout=60

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
          dotnet-quality: 'preview'

      - name: Install workloads
        run: |
          dotnet workload install wasm-tools
          dotnet workload restore Habitinator.slnx

      - name: Build
        run: dotnet build Habitinator.slnx --configuration Release

      - name: Test App.Shared.Tests
        id: test_shared
        continue-on-error: true
        run: >
          dotnet test tests/App.Shared.Tests/App.Shared.Tests.csproj
          --configuration Release
          --no-build
          --results-directory "$TestResultsDir"
          --logger "trx;LogFileName=App.Shared.Tests.trx"

      - name: Test App.Shared.RCL.Tests
        id: test_shared_rcl
        continue-on-error: true
        run: >
          dotnet test tests/App.Shared.RCL.Tests/App.Shared.RCL.Tests.csproj
          --configuration Release
          --no-build
          --results-directory "$TestResultsDir"
          --logger "trx;LogFileName=App.Shared.RCL.Tests.trx"

      - name: Test App.Web.IntegrationTests
        id: test_web_integration
        continue-on-error: true
        run: >
          dotnet test tests/App.Web.IntegrationTests/App.Web.IntegrationTests.csproj
          --configuration Release
          --no-build
          --results-directory "$TestResultsDir"
          --logger "trx;LogFileName=App.Web.IntegrationTests.trx"

      - name: Fail job if any test suite failed
        if: always()
        run: |
          if [ "${{ steps.test_shared.outcome }}" != "success" ] || \
             [ "${{ steps.test_shared_rcl.outcome }}" != "success" ] || \
             [ "${{ steps.test_web_integration.outcome }}" != "success" ]; then
            echo "One or more test suites failed."
            exit 1
          fi

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-trx
          path: TestResults/**/*.trx

      - name: Publish test results to GitHub Checks
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test results by suite
          files: TestResults/**/*.trx
          comment_mode: failures
