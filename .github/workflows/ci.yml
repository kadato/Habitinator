name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NO_LOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TestResultsDir: ${{ github.workspace }}/TestResults

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          include-prerelease: true

      - name: Restore workloads
        run: dotnet workload restore Habitinator.slnx

      - name: Build
        run: dotnet build Habitinator.slnx --configuration Release

      - name: Test
        run: >
          dotnet test Habitinator.slnx
          --configuration Release
          --no-build
          --results-directory "$TestResultsDir"
          --logger trx

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: TestResults/**/*.trx

      - name: Publish test results to GitHub Checks
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test results
          files: TestResults/**/*.trx
          comment_mode: off
