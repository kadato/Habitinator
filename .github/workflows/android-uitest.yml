# Manual Android UI tests (Appium + emulator). Heavy; run when changing MAUI Android UI.
# Prereqs on the runner: MAUI Android workload, Node (Appium 2), emulator — may need tuning per SDK updates.

name: Android UI tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uitest:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            11.0.x
          dotnet-quality: 'preview'

      - name: Setup Node.js (Appium)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build Android app and test project
        run: |
          dotnet build src/App.MAUI/App.MAUI.csproj -f net11.0-android -c Debug
          dotnet build tests/App.MAUI.UITests/App.MAUI.UITests.csproj -c Debug

      - name: Emulator + Appium + dotnet test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            set -eux
            npm install -g appium
            appium driver install uiautomator2
            appium --log-level error &
            sleep 8
            APK="$(ls -1 src/App.MAUI/bin/Debug/net11.0-android/*-Signed.apk 2>/dev/null | head -1 || true)"
            if [ -z "$APK" ]; then APK="$(ls -1 src/App.MAUI/bin/Debug/net11.0-android/*.apk | head -1)"; fi
            test -f "$APK"
            export ANDROID_UI_TESTS=1
            export ANDROID_APP_PATH="$(readlink -f "$APK")"
            dotnet test tests/App.MAUI.UITests/App.MAUI.UITests.csproj -c Debug --no-build --logger trx --results-directory "$GITHUB_WORKSPACE/TestResults-android"

      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-uitest-trx
          path: TestResults-android/**/*.trx
